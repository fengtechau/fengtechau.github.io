<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FengTech — IT support & free tools, Sydney</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="FengTech — Sydney IT services: AI-assisted, fast fixes for computers, networks and websites, at prices below the big providers. Plus free tools: IP lookup, a case converter and a practice metronome."
    />
    <meta name="theme-color" content="#2d6ae3" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved color theme before first paint to avoid a flash.
      (function () {
        try {
          var mode = localStorage.getItem('fengtech.theme');
          var dark =
            mode === 'dark' ||
            ((!mode || mode === 'auto') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T6MJBQ5P0Z"></script>
  <script>

    function gtag() {
      dataLayer.push(arguments);
    }
    gtag('js', new Date());

    gtag('config', 'G-T6MJBQ5P0Z');
  </script>

  <body>
    <app-root></app-root>
  </body>
</html>
