<section class="ft-section" aria-labelledby="contact-title">
  <div class="ft-container">
    <div class="contact">
      <div class="contact__info">
        <h1 id="contact-title" class="ft-section__title">
          {{ 'HOME.CONTACT_TITLE' | translate }}
        </h1>
        <p class="contact__lead">{{ 'HOME.CONTACT_LEAD' | translate }}</p>
        <a
          class="ft-btn ft-btn--primary contact__cta"
          href="mailto:info@fengtech.com.au"
        >
          <fa-icon [icon]="icons.faEnvelope" aria-hidden="true" />
          {{ 'HOME.CONTACT_CTA' | translate }}
        </a>
        <p class="contact__line">
          <strong>{{ 'HOME.CONTACT_EMAIL_LABEL' | translate }}</strong>
          <a href="mailto:info@fengtech.com.au">info@fengtech.com.au</a>
        </p>
        <p class="contact__line">
          <strong>{{ 'HOME.CONTACT_PHONE_LABEL' | translate }}</strong>
          <a href="tel:+61411758128">0411 758 128</a>
          <span class="contact__hint">{{ 'HOME.CONTACT_PHONE_HINT' | translate }}</span>
        </p>
      </div>
      <img
        class="contact__logo"
        src="/assets/images/Logo/png/ColorNoBg.png"
        alt="FengTech logo"
        loading="lazy"
      />
    </div>
  </div>
</section>
